name: health-quiz CI

on:
  push:
    paths:
      - "health-quiz/**"
      - ".github/workflows/health-quiz-ci.yml"
  pull_request:
    paths:
      - "health-quiz/**"
      - ".github/workflows/health-quiz-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-quiz

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: health_quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/health_quiz_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/health_quiz_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: health-quiz/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Run tests (unit + integration + e2e)
        run: npm test

      - name: Production build
        run: npm run build
